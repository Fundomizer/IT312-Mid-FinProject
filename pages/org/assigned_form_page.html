<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../../styles/navigation_bar_style.css">
    <link rel="stylesheet" href="../../styles/org/org_style.css">
    <link rel="stylesheet" href="../../styles/org/org_form_style.css">
    <link rel="stylesheet" href="../../styles/common.css">
    <script src="../../scripts/navigation_bar.js" defer></script>
    <script type="module" src="../../scripts/org/org_script.js" defer></script>
    <script type="module" src="../../scripts/org/org_popup_script.js" defer></script>
    <title>Assigned Forms</title>
</head>

<body>
    <section id="PageContent">

        <div>
            <h1 id="Associated-Org-Name">Association for Computing Machinery (ACM)</h1>
            <p>Submit and manage your organization's requirements</p>
        </div>

        <div class="SearchFilterContainer">
            <div class="SearchBar">
                <img src="../../assets/images/icons/magnify_icon.png" alt="Magnify icon">
                <input id="SearchInput" type="text" placeholder="Search for assigned forms">
            </div>
            <button class="FilterButton">
                <img src="../../assets/images/org_icons/filter.png" alt="Filter">
                 Filter
            </button>
        </div>

        <div class="FilterPanel" id="Filter">
            <div class="FilterContent">
                <div id="GroupedFilter">
                    <label><h3>Ordered by:</h3></label>
                    <select id="FilterDropdown">
                        <option value="Asc">Ascending</option>
                        <option value="Desc">Descending</option>
                    </select>
                </div>
                <label><h3>Tags:</h3></label>
                <div class="TagsContainer" id="TagsContainer"> <!-- Populate Tags -->
                    <input type="checkbox" id="TagsButton1">
                    <label for="TagsButton1">Tag</label>
                    <input type="checkbox" id="TagsButton2">
                    <label for="TagsButton2">Tag</label>
                    <input type="checkbox" id="TagsButton3">
                    <label for="TagsButton3">Tag</label>
                    <input type="checkbox" id="TagsButton4">
                    <label for="TagsButton4">Tag</label>   
                </div>
                <div class="FilterActionButtons">
                    <button id="ClearFilterButton">Clear Filter</button>
                    <button id="ApplyFilterButton">Apply Filter</button>
                </div>
            </div>
        </div>
        
        <div class="Card">
            <div>
                <h4>Forms Assigned to Your organization</h4>
                <p>
                    Fill out these structured forms to submit requirements. Forms ensure all necessary information is
                    captured
                    for easy searching by OSA
                </p>
            </div>
            <div class="PopupForm">
                <button id="EkisButton"><img src="../../assets/images/org_icons/close.png"></button>

                <form class="Form">
                    <label for="FormTitle"><h3>(Form Title)</h3></label><br>
                    <label>(Form Description)</label><br>
                    <div class="FormFields">
                        <label for="Field"><span>(Field)</span></label>
                        <input type="text" id="FormAssigned">
                    </div>
                    <div class="FormFields">
                        <label for="Field"><span>(Field)</span></label>
                        <input type="text" id="FormAssigned">
                    </div>
                    <div class="FormUpload">
                        <span>Supporting Documents</span>
                        <label for="UploadButton">Upload File</label>
                        <input type="file" id="UploadButton">
                    </div>
                    <div class="FormButtons">
                        <button id="CancelForm">Cancel</button>
                        <button type="submit" id="SubmitForm">Submit Form</button>
                    </div>
                </form>

            </div>
            <div id="Forms">

            </div>
        </div>
    </section>
</body>
</html>
