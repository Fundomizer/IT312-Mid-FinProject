<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script type="module" src="../../scripts/osa/osa_auth.js" defer></script>

  <title>Create Form | OSA</title>
</head>
<body>
  <section id="PageContent">  
    <div class="create-form-header">
      <button id="backBtn" class="back-button">← Back</button>
      <div id="title">
        <h2>Create New Form</h2>
        <p>Design and publish forms to student organizations for structured submissions.</p>
      </div>
    </div>

    <div class="Card">
      <div class="form-meta">
        <input type="text" id="formTitle" placeholder="Enter form title" required>
        <textarea id="formDescription" placeholder="Enter form description"></textarea>
      </div>


      <div class="tag-section">
        <label for="tagInput">Tags</label>
        <input id="tagInput" type="text" placeholder="Type tags separated by commas">
      </div>
<div class="toggle-file">
  <label class="form-file-upload-toggle">
    <input type="checkbox" id="formFileRequired">
    File Upload Required for this Form
  </label>
</div>



      <div class="org-assignment">
        <label>Assign to Organizations</label>
        <select id="orgSelect" multiple style="width:100%; padding:8px; margin-top:5px;">
        </select>
        <p>Hold Ctrl to select multiple organizations, or leave blank for all.</p>
      </div>


      <div class="form-fields" id="formFields"></div>


      <div class="add-field-controls">
        <select id="fieldType">
          <option value="text">Short Answer</option>
          <option value="textarea">Paragraph</option>
          <option value="checkbox">Checkbox</option>
          <option value="radio">Multiple Choice</option>
        </select>
        <button id="addFieldBtn">+ Add Field</button>
      </div>
      <button class="submit-form-btn" id="submitFormBtn">Submit Form</button>
    </div>
  </section>
</body>
</html>
