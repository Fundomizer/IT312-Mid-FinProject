<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="../../assets/images/icons/favicon.png">
    <link rel="stylesheet" href="../../styles/navigation_bar_style.css">
    <link rel="stylesheet" href="../../styles/navigation_bar_mobile_style.css">
    <link rel="stylesheet" href="../../styles/common.css">
    <script type="module" src="../../scripts/auth.js"></script>
    <script type="module" src="../../scripts/config.js" defer></script>
    <script type="module" src="../../scripts/navigation_bar.js" defer></script>
    <script type="module" src="../../scripts/osa/osa_script.js" defer></script>
    <script type="module" src="../../scripts/utilities.js" defer></script>

    <title>OSA Page</title>
</head>

<body>
    <div id="Overlay"></div>
    <div id="SideNav">
        <button id="ToggleSideNavButton">
            <img src="../../assets/images/icons/formula_logo.png" alt="HamburgerMenu" class="hamburger-icon">
            <span class="toggle-text">
                <span class="toggle-label">FORMula</span>
                <span class="toggle-sublabel">Menu</span>
            </span>
        </button>
        <div class="SideNavContent">
            <ul>
                <li>
                    <button class="NavItems" data-link="overview_page.html" id="overviewButton">
                        <span class="icon">
                            <img src="../../assets/images/icons/dashboard_icon.png" alt="Dashboard icon">
                        </span>
                        <span class="label">Dashboard</span>
                    </button>
                </li>
                <li>
                    <button class="NavItems" data-link="forms_page.html" id="formsButton">
                        <span class="icon">
                            <img src="../../assets/images/icons/forms_icon.png" alt="Dashboard icon">
                        </span>
                        <span class="label">Forms</span>
                    </button>
                </li>
                <li>
                    <button class="NavItems" data-link="repository_page.html" id="repositoryButton">
                        <span class="icon">
                            <img src="../../assets/images/icons/folder_icon.png" alt="Dashboard icon">
                        </span>
                        <span class="label">Repository</span>
                    </button>
                </li>
            </ul>
        </div>
    </div>
    <section class="Main">
        <div id="TopNav">

            <div class="TopNavContents">
                <button class="TopNavButton">
                    <img src="../../assets/images/icons/bell_icon.png" alt="Bell icon">
                </button>
                <button class="TopNavButton UserProfile">
                    <img id="UserProfilePic" src="../../assets/images/icons/users_icon.png" alt="User profile pic">
                    <p id="UsernameLabel">Username</p>
                </button>
                <button id="Logout" class="TopNavButton">
                    <img src="../../assets/images/icons/logout_icon.png" alt="Logout icon">Logout</button>
            </div>
        </div>
        <div id="Content">
        </div>
    </section>
</body>

</html>
