<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../../styles/navigation_bar_style.css">
    <script src="../../scripts/navigation_bar.js" defer></script>
    <script type="module" src="../../scripts/osa/osa_script.js" defer></script>
    <script type="module" src="../../scripts/osa/overview_script.js" defer></script>

    <title>OSA Page</title>
</head>
<body>
    <div id="SideNav">
        <button id="ToggleSideNavButton">
            <img src="../../assets/images/icons/Hamburger_Icon.png" alt="HamburgerMenu" class="hamburger-icon">
        </button>
        <div class="SideNavContent">
            <ul>
                <li>
                    <button class="NavItems" id="overviewButton">
                        <span class="icon">📊</span>
                        <span class="label">Dashboard</span>
                    </button>
                </li>
                <li>
                    <button class="NavItems" id="formsButton">
                        <span class="icon">👥</span>
                        <span class="label">Forms</span>
                    </button>
                </li>
                <li>
                    <button class="NavItems" id="repositoryButton">
                        <span class="icon">🏫</span>
                        <span class="label">Repository</span>
                    </button>
                </li>
            </ul>
        </div>
    </div>
    <section class="Main">
        <div id="TopNav">

            <div class="TopNavContents">
                <button class="TopNavButton">
                    <img src="../../assets/images/icons/bell_icon.png" alt="Bell icon">
                </button>
                <button class="TopNavButton UserProfile">
                    <img id="UserProfilePic" src="" alt="User profile pic">
                    <p id="UsernameLabel">Username</p>
                </button>
                <button class="TopNavButton">
                    <img src="../../assets/images/icons/logout_icon.png" alt="Logout icon">Logout</button>
            </div>
        </div>
        <div id="Content">
        </div>
    </section>
</body>
</html>
