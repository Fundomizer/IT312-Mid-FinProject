<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script type="module" src="../../scripts/osa/osa_auth.js" defer ></script>

  <title>Repository</title>
</head>


<body>
   <main id="PageContent" role="main">
    <h2>Welcome to the repository</h2>
    <p>Search and filter all organization requirements.</p>


<div class="topbar">
  <div class="search">
    <input id="searchInput" placeholder="Search requirements, title, or description..." />


    <div class="filters">
      <div class="filter-block">
        <div class="filter-title">Tags</div>
        <input type="text" id="tagFilterInput" placeholder="Enter tags separated by commas" />
      </div>


      <div class="filter-block">
        <div class="filter-title">Organization</div>
        <select id="filterLocation">
          <option value="">All Orgs</option>
          <option value="GCS">GCS</option>
          <option value="Debate Soc">Debate Soc</option>
          <option value="Math Club">Math Club</option>
          <option value="Culture Club">Culture Club</option>
        </select>
      </div>


      <div class="filter-block">
        <div class="filter-title">Date</div>
        <div class="date-row">
          <input type="date" id="dateFrom">
          <span>to</span>
          <input type="date" id="dateTo">
        </div>
      </div>


      <button class="btn" id="clearFilters">Clear</button>
    </div>
  </div>


  <div style="display:flex;gap:12px;align-items:center">
    <div class="muted">Showing <span id="shownCount">5</span> of <span id="totalCount">5</span> results</div>
  </div>
</div>




      <section class="panel" aria-labelledby="repoHeading">
        <h2 id="repoHeading">Requirements Repository</h2>
        <div class="meta-row">
          <div class="results-info">Use the search bar to filter by title, location or tags</div>
        </div>


      <div class="list" id="repoList">


        <div class="submission-item">
          <div class="sub-header">
            <div class="submission-name">Sample Submission 1</div>
            <div class="submission-tag">Event Proposal</div>
          </div>
          <div class="sub-details">
            <div class="submission-org-name">Computer Society</div>
            <div class="submission-org-shortname">CS</div>
            <div class="submission-date">2024-06-01</div>
          </div>
        </div>


      <!-- Modal -->
      <div id="formDetailsModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.6); justify-content:center; align-items:center; z-index:1000;">
        <div style="background:#0f1724; padding:1.5rem; border-radius:12px; width:90%; max-width:700px; color:white; max-height:90%; overflow:auto; position:relative; box-shadow:0 6px 24px rgba(0,0,0,0.7); line-height:1.6; font-size:0.875rem;">
          <button id="closeModal" style="position:absolute; top:10px; right:10px; background:#7c3aed; border:none; padding:6px 0.75rem; border-radius:6px; cursor:pointer; color:white; font-weight:600;">Close</button>
          <h2 id="modalOrgName" style="display:flex; flex-direction:column; gap:12px;"></h2>
          <div id="modalRequirements" style="margin-top:12px; display:flex; flex-direction:column; gap:12px;"></div>
        </div>
      </div>
   </main>
</body>
</html>
