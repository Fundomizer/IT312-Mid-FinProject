<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Repository</title>
</head>
<body>
   <main id="PageContent" role="main">
      <div id="title">
        <h2>Welcome to the repository</h2>
        <p>Search and filter all organization requirements.</p>
      </div>

      <div class="topbar">
        <div class="Card search">
          <input id="searchInput" placeholder="Search requirements, title, or description..." />
          <div class="filters">
            <div class="SubCard  filter-block">
              <div class="filter-title">Tags</div>
              <input type="text" id="tagFilterInput" placeholder="Enter tags separated by commas" />
            </div>
            <div class="SubCard filter-block">
              <div class="filter-title">Organization</div>
              <select id="filterLocation">
                <option value="">All Orgs</option>
                <option value="GCS">GCS</option>
                <option value="Debate Soc">Debate Soc</option>
                <option value="Math Club">Math Club</option>
                <option value="Culture Club">Culture Club</option>
              </select>
            </div>
            <div class="SubCard filter-block">
              <div class="filter-title">Date</div>
              <div class="date-row">
                <input type="date" id="dateFrom">
                <span>to</span>
                <input type="date" id="dateTo">
              </div>
            </div>
            <button class="StyledButton btn" id="clearFilters">Clear</button>
          </div>
        </div>
        <div style="display:flex;gap:12px;align-items:center">
          <div class="muted">Showing <span id="shownCount">0</span> of <span id="totalCount">0</span> results</div>
        </div>
      </div>

      <section class="panel" aria-labelledby="repoHeading">
        <h2 id="repoHeading">Requirements Repository</h2>
        <div class="meta-row">
          <div class="results-info">Use the search bar to filter by title, location or tags</div>
          <div class="results-info" id="lastUpdated">Updated: Oct 2024</div>
        </div>

        <!-- Table for submissions -->
        <table id="submissions-table">
          <thead>
            <tr>
              <th>Submission Name</th>
              <th>Tag</th>
              <th>Organization</th>
              <th>Short Name</th>
              <th>Date</th>
            </tr>
          </thead>
          <tbody>
            <!-- rows injected by JS -->
          </tbody>
        </table>
      </section>

      <!-- Modal -->
      <div id="formDetailsModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.6); justify-content:center; align-items:center; z-index:1000;">
        <div style="background:#0f1724; padding:24px; border-radius:12px; width:90%; max-width:700px; color:white; max-height:90%; overflow:auto; position:relative; box-shadow:0 6px 24px rgba(0,0,0,0.7); line-height:1.6; font-size:14px;">
          <button id="closeModal" style="position:absolute; top:10px; right:10px; background:#7c3aed; border:none; padding:6px 12px; border-radius:6px; cursor:pointer; color:white; font-weight:600;">Close</button>
          <h2 id="modalOrgName" style="display:flex; flex-direction:column; gap:12px;"></h2>
          <div id="modalRequirements" style="margin-top:12px; display:flex; flex-direction:column; gap:12px;"></div>
        </div>
      </div>
   </main>
</body>
</html>
