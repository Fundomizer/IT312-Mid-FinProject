<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <section id="PageContent">
        <div>
            <h1>Admin Dashboard</h1>
            <p>View system activity</p>
        </div>

        <div class="SearchBar">
            <img src="../../assets/images/icons/magnify_icon.png" alt="Magnify icon">
            <input id="SearchInput" type="text" placeholder="Search for users">
        </div>

        <div class="Card" id="LogsView">
            <div class="Header">
                <div>
                    <p><b>Activity Logs</b></p>
                    <p>Complete log of all user and OSA activities</p>
                </div>
            </div>
            <div>
                <table id="AccountsTableView">
                    <tr>
                        <th>Action</th>
                        <th>Name</th>
                        <th>Activity</th>
                        <th>Date</th>
                        <th>Time</th>
                    </tr>
                </table>
            </div>
        </div>
    </section>
</body>

</html>
