<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <section id="PageContent">
        <div>
            <h1>User management</h1>
            <p>Manage user accounts and view system activity</p>
        </div>

        <div class="SearchBar">
            <img src="../../assets/images/icons/magnify_icon.png" alt="Magnify icon">
            <input id="SearchInput" type="text" placeholder="Search for users">
        </div>

        <div id="AccountsView">
            <div class="Header">
                <div>
                    <p><b>User accounts</b></p>
                    <p>Create, Read, Update, and Delete user accounts</p>
                </div>
                <button id="AddUserButton">
                    <img src="" alt="add-user-icon">
                    <span>Add user</span>
                </button>
            </div>
            <div>
                <table id="AccountsTableView">
                    <tr>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Role</th>
                        <th>Created</th>
                        <th>Action</th>
                    </tr>

                </table>
            </div>
        </div>
    </section>
</body>

</html>
