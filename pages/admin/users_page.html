<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <section id="PageContent">
        <div class="PopUp" id="AddPopup">
            <div class="PopUpContent" id="AddPopupContent">
                <button id="EkisButton"><img src="../../assets/images/org_icons/close.png"></button>
                <form>
                    <label for="UserRole">User role:</label>
                    <select name="UserRole" id="UserRole">
                        <option value="Admin">Admin</option>
                        <option value="OSA">Office of student affair</option>
                        <option value="ORG">Student organization</option>
                    </select>
                    <br />
                    <label for="name">Name</label>
                    <input type="text" name="name">
                    <br />
                    <label for="email">Email</label>
                    <input type="text" name="email">
                    <br />
                    <label for="password">Password</label>
                    <input type="text" name="password">

                    <!-- Forms for ORG -->
                    <div class="Hidden" id="OrgForm">
                        <label for="organization">Organization</label>
                        <input type="text" name="organization">
                    </div>
                    <!-- Forms for OSA -->
                    <div class="Hidden" id="OsaForm">
                        <label for="department">Department</label>
                        <input type="text" name="department">
                    </div>

                    <input type="submit">
                </form>
            </div>
        </div>
        <div>
            <h1>User management</h1>
            <p>Manage user accounts</p>
        </div>

        <div class="SearchBar">
            <img src="../../assets/images/icons/magnify_icon.png" alt="Magnify icon">
            <input id="SearchInput" type="text" placeholder="Search for users">
        </div>

        <div class="Card" id="AccountsView">
            <div class="Header">
                <div>
                    <p><b>User accounts</b></p>
                    <p>Create, Read, Update, and Delete user accounts</p>
                </div>
                <button class="StyledButton" id="AddUserButton">
                    <img src="../../assets/images/admin_icons/addusers_icon.png" alt="add-user-icon">
                    <span>Add user</span>
                </button>
            </div>
            <div>
                <table class="AmogusTable" id="AccountsTableView">
                    <tr>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Role</th>
                        <th>Created</th>
                        <th>Action</th>
                    </tr>
                </table>
            </div>
        </div>
    </section>
</body>

</html>
