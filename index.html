<html lang="en">

<head>

    <link rel="icon" href="./assets/images/icons/favicon.png">

<body>
    <section class="Main">
        <div>
            <div class="Card LoginForm">
                <div class="LoginTitle">
                    <div class="ImageWrapper">
                        <img src="./assets/images/slu_logo.png" alt="SLU logo">
                    </div>
                    <div class="header">
                        <h1>FORMula:</h1>

                </div>
                <div>
                    <p>or
                    </p>
                </div>
                <button id="GoogleLogin"><img src="./assets/images/icons/Google.png" alt="Google Icon"> Login with

            </div>
