<!DOCTYPE html>
<html lang="en">

<head>

    <script src="./scripts/main.js" async></script>
    <link rel="icon" href="./assets/images/icons/favicon.png">
    <link rel="stylesheet" href="./styles/common.css">

    <title>FORMula</title>
</head>

<body>

                </div>
